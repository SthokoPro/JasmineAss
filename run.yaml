# Task 9: run.yaml

apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  generateName: tax-calculator-pipeline-run-
spec:
  pipelineRef:
    name: tax-calculator-pipeline

  workspaces:
    - name: pipeline-workspace
      persistentVolumeClaim:
        claimName: tax-calculator-pvc

  params:
    - name: image
      value: us.icr.io/YOUR_NAMESPACE/tax-calculator:latest
